params:
  description: "Woo-Taek Jeon's personal academic website: research, papers, ideas, methods, and photography."
  author: Woo-Taek Jeon

  DateFormat: "January 2006"
  defaultTheme: light
  hideFooter: false
  disableThemeToggle: true
  ShowShareButtons: false
  ShowReadingTime: false
  disableSpecial1stPost: true
  disableAnchoredHeadings: true
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowAllPagesInArchive: false
  MainSections: [research, paper, idea, photo, method]
  ShowToc: false
  disableScrollToTop: true
  TocOpen: true
  ShowWordCount: false
  UseHugoToc: true
  comments: false
  math: true

  profileMode:
    enabled: true
    title: Woo-Taek Jeon
    subtitle: "Plant scientist interested in plant development, environmental responses, and plant surface biology."
    imageUrl: picture.jpeg
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Research
        url: research/
      - name: Papers
        url: paper/
      - name: Ideas
        url: idea/
      - name: Photo
        url: photo/
      - name: Methods
        url: method/
      - name: Lab
        url: https://biosci.snu.ac.kr/pcb

  socialIcons:
    - name: CV
      url: cv.pdf
    - name: Google Scholar
      url: https://scholar.google.com/citations?user=WUtfopcAAAAJ&hl=en
    - name: GitHub
      url: https://github.com/Taek-2000
    - name: Email
      url: mailto:dnxor2275@snu.ac.kr

  assets:
    disableScrollBarStyle: true

  cover:
    hiddenInList: false
    hiddenInSingle: true

  label:
    text: Woo-Taek Jeon
    icon: favicon.ico
    iconHeight: 18

